name: APK bauen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: APK bauen
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/*.apk PlaylistEQ.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PlaylistEQ-apk
          path: PlaylistEQ.apk

      - name: Als Release veröffentlichen (Download aufs Handy)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PlaylistEQ Build ${{ github.run_number }}
          make_latest: true
          files: PlaylistEQ.apk
